<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap">
<style>
:root{--bg:#FFFDF8;--card:#fff;--ink:#263B68;--mut:#66779b;--pri:#A9C8F5;--pow:#DCEBFF;--lav:#DCD7FF;--pink:#F7D8E7;--gold:#E8C982;--line:#e4ecf8;--red:#c4506a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#141a2b;--card:#1d2540;--ink:#e8eefc;--mut:#9fb0d3;--pow:#26335c;--lav:#2d2c55;--pink:#4a2d44;--line:#2c3760}}
:root[data-theme=dark]{--bg:#141a2b;--card:#1d2540;--ink:#e8eefc;--mut:#9fb0d3;--pow:#26335c;--lav:#2d2c55;--pink:#4a2d44;--line:#2c3760}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 'Be Vietnam Pro',system-ui,'Segoe UI',sans-serif}
.app{display:grid;grid-template-columns:210px minmax(0,1fr);min-height:100vh}
nav.side{position:sticky;top:0;height:100vh;padding:20px 12px;background:var(--card);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:12px}
.brand{font-size:22px;font-weight:700;letter-spacing:.04em;padding:0 10px;display:flex;align-items:center;gap:8px}.brand img{width:30px;height:30px;border-radius:24%}
.links{display:flex;flex-direction:column;gap:4px}
.links a{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;color:var(--ink);text-decoration:none;font-weight:500}
.links a.on{background:var(--pow);font-weight:700}.links i{width:10px;height:10px;border-radius:50%;background:var(--pri)}
.sidecute{margin-top:auto;display:flex;justify-content:center}
main{padding:24px;max-width:1000px;width:100%}
h1{font-size:clamp(20px,4vw,26px);margin:0 0 10px}h2{font-size:17px;margin:0 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:0 2px 10px rgba(38,59,104,.06)}
.g2{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));margin-top:14px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));margin-bottom:16px}
.row{display:flex;align-items:center;gap:12px}.wrap{flex-wrap:wrap}.end{justify-content:flex-end}
.btn{border:0;border-radius:12px;padding:9px 16px;background:var(--pri);color:#263B68;font:inherit;font-weight:600;cursor:pointer;min-height:42px}
.btn.g{background:transparent;border:1px solid var(--line);color:var(--ink)}.btn.d{background:var(--pink)}.btn.sm{padding:5px 10px;min-height:40px;font-size:13px}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 10px;width:100%;min-height:42px}
input[type=checkbox]{width:20px;height:20px;min-height:0;flex:none}
.f label{display:block;font-size:13px;color:var(--mut);margin:8px 0 2px}.f .dayl{display:flex;gap:4px;align-items:center;margin:0;color:var(--ink)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}.fl{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}
.bar{height:10px;background:var(--pow);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--pri);border-radius:9px}
.chip{font-size:12px;padding:2px 9px;border-radius:99px;background:var(--pow);white-space:nowrap}.chip.red{background:var(--pink)}
.gold{font-weight:700;background:var(--pow);padding:5px 12px;border-radius:99px;white-space:nowrap}.gold:before{content:'';display:inline-block;width:11px;height:11px;border-radius:50%;background:var(--gold);margin-right:6px}
.mut{color:var(--mut)}.meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}.dn{text-decoration:line-through;opacity:.6}.cc:before{background:#e48bb0}.btn:disabled{opacity:.6;cursor:default}.hc{width:20px;height:20px;border-radius:5px;border:1px solid var(--line);background:var(--pow);padding:0;cursor:pointer}.hc.on{background:var(--pri)}.hc.fu{opacity:.35;cursor:default}.hc.td{outline:2px solid var(--gold)}
.task{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}.task:last-child{border:0}
.chk{width:28px;height:28px;border-radius:9px;border:2px solid var(--pri);background:none;color:#263B68;font-weight:700;cursor:pointer;flex:none}.chk.on{background:var(--pri)}
.av{position:relative;flex:none}.ai{position:absolute;inset:11%;border-radius:50%;overflow:hidden}.ai img,.ai svg{width:100%;height:100%;object-fit:cover;display:block}.av>svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.pc{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px}.pc .btn{width:100%}
.ico{width:56px;height:56px;border-radius:50%;background:var(--lav);display:grid;place-items:center}.ico svg{width:28px;height:28px}
.opt{border:2px solid var(--line);background:var(--card);border-radius:14px;padding:8px;cursor:pointer;color:var(--ink);font:inherit;display:flex;flex-direction:column;align-items:center;gap:4px}.opt.sel{border-color:var(--gold)}
.err2{color:var(--red);min-height:1.2em;margin:6px 0;font-weight:500}
dialog{border:0;border-radius:18px;padding:20px;width:min(520px,94vw);max-height:90vh;overflow:auto;background:var(--card);color:var(--ink)}dialog::backdrop{background:rgba(38,59,104,.35)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,16px);opacity:0;pointer-events:none;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:14px;transition:.25s;z-index:30;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}.toast.err{background:var(--red);color:#fff}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
